<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="《同一张世界的地图》三部曲：从语言模型到 JEPA，入门篇、进阶篇、专业篇。在线免费阅读，可下载 PDF。">
  <title>同一张世界的地图 · JEPA 三部曲</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    :root { --theme-color: #14507a; }
    .markdown-section { max-width: 900px; padding-bottom: 60px; }
    .markdown-section h1 { font-size: 1.8rem; line-height: 1.45; margin: 1.2em 0 .8em; }
    .markdown-section h2 { font-size: 1.3rem; margin: 1.8em 0 .6em; padding-left: .5em;
                           border-left: 3px solid var(--theme-color); }
    .markdown-section h3 { font-size: 1.06rem; margin: 1.4em 0 .5em; }
    .markdown-section p, .markdown-section li { line-height: 1.9; }
    .markdown-section blockquote { border-left: 3px solid #9fbdd2; background: #f4f8fb;
                                   padding: .6em 1em; color: #3f4c59; }
    .markdown-section img { max-width: 100%; }
    .markdown-section figure { margin: 1.4em 0; text-align: center; }
    .markdown-section figcaption { font-size: .86rem; color: #6b7280; margin-top: .5em; }
    .markdown-section table { font-size: .9rem; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: .2em 0; }
    .app-nav { margin-right: 12px; }

    section.cover {
      background-color: #060b12 !important;
      background-image: url(books/basics/images/cover/cover-art.jpg) !important;
      background-size: cover !important;
      background-position: 40% 48% !important;
      background-repeat: no-repeat !important;
      color: #f2f7fb;
    }
    section.cover::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, rgba(4,9,16,.94) 0%, rgba(4,9,16,.76) 44%,
                  rgba(4,9,16,.40) 74%, rgba(4,9,16,.26) 100%);
    }
    section.cover .cover-main { position: relative; z-index: 1; }
    section.cover .cover-main h1,
    section.cover .cover-main h1 a,
    section.cover .cover-main h1 span { color: #fff !important; letter-spacing: .12em;
      text-shadow: 0 3px 30px rgba(2,7,12,.95); }
    section.cover .cover-main blockquote { color: rgba(232,242,250,.92); border-left: none; }
    section.cover .cover-main p { color: rgba(222,236,246,.88); }
    section.cover .cover-main > p:last-child a {
      border-radius: 4px; padding: .7em 2.2em; font-size: 1rem;
      border: 1px solid rgba(224,168,92,.78); color: #fff;
      background: rgba(20,80,122,.62); transition: background .2s;
    }
    section.cover .cover-main > p:last-child a:hover { background: rgba(20,80,122,.95); }
  </style>
</head>
<body>
  <div id="app">正在加载…</div>

  <script>
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#/"]');
      if (!a) return;
      var m = a.getAttribute('href').match(/^#\/(.+\.(?:pdf|zip|png|jpe?g|gif|svg|json|txt|csv))$/i);
      if (!m) return;
      e.preventDefault();
      window.open(new URL('.', location.href).pathname + m[1], '_blank', 'noopener');
    }, true);

    window.$docsify = {
      name: '同一张世界的地图',
      nameLink: '/',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      onlyCover: false,
      alias: {
        '.*books/basics/.*_sidebar\.md': '/books/basics/_sidebar.md',
        '.*books/practice/.*_sidebar\.md': '/books/practice/_sidebar.md',
        '.*books/theory/.*_sidebar\.md': '/books/theory/_sidebar.md',
        '.*_sidebar\.md': '/_sidebar.md'
      },
      auto2top: true,
      maxLevel: 3,
      search: {
        placeholder: '搜索全书…',
        noData: '没有找到结果',
        depth: 3
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      mermaid: { theme: 'default' },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            // 章节里的图片写 ../images/NN/x.png（GitHub 也能直接看），
            // 在 docsify 里按当前册改写成仓库绝对路径。
            var base = new URL('.', location.href).pathname;
            var m = location.hash.match(/^#\/(books\/[^\/]+)\//);
            var prefix = m ? m[1] + '/images/' : 'books/basics/images/';
            html = html.replace(/(src=")\.\.\/images\//g, '$1' + base + prefix);
            return html;
          });
          hook.doneEach(function () {
            var base = new URL('.', location.href).pathname;
            document.querySelectorAll('a[href^="#/"]').forEach(function (a) {
              var m = a.getAttribute('href').match(/^#\/(.+\.(?:pdf|zip|png|jpe?g|gif|svg|json|txt|csv))$/i);
              if (m) { a.setAttribute('href', base + m[1]); a.setAttribute('target', '_blank'); }
            });
            var el = document.querySelector('.markdown-section');
            if (!el || typeof renderMathInElement !== 'function') return;
            renderMathInElement(el, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false }
              ],
              ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
              throwOnError: false,
              macros: { '\\RR': '\\mathbb{R}', '\\bm': '\\boldsymbol{#1}', '\\T': '^{\\top}' }
            });
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
